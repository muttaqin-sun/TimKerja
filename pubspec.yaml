name: timkerja
description: "Aplikasi manajemen tugas dan kolaborasi tim berbasis Kanban."

# Mencegah package dipublikasikan secara tidak sengaja ke pub.dev (khusus proyek privat)
publish_to: "none"

# Versi aplikasi (format: major.minor.patch+build_number)
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Daftar package utama yang dibutuhkan aplikasi
dependencies:
  flutter:
    sdk: flutter

  # UI & Ikon
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0

  # Backend & Otentikasi
  supabase_flutter: ^2.18.3

  # Media & Dokumen
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.4.0

# Package khusus kebutuhan pengembangan dan pengujian
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Konfigurasi spesifik Flutter
flutter:
  # Mengaktifkan penggunaan ikon bawaan Material Design
  uses-material-design: true

  # Folder aset gambar aplikasi
  assets:
    - assets/images/

# Konfigurasi generator ikon launcher aplikasi (Android & iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
